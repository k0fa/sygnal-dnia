name: Gemini - jednorazowy test bez publikacji

on:
  workflow_dispatch:
  push:
    branches:
      - ai/test-gemini
      - fix/finish-newsroom
permissions:
  contents: read

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj zaleznosci
        run: python -m pip install -r requirements.txt
      - name: Uruchom testy offline
        run: python -m unittest discover -v
      - name: Gemini test bez publikacji
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
        run: python tools/gemini_dry_run.py
