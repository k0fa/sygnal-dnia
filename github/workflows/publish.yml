name: Generate and publish news

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'content/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test pipeline offline
        run: python -m unittest -v test_pipeline.py

      - name: Fetch RSS
        if: github.event_name != 'push'
        run: python scraper.py

      - name: Generate articles
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
          MAX_ARTICLES: '2'
        run: python generator.py

      - name: Build HTML
        run: python build.py

      - name: Commit generated content
        shell: bash
        run: |
          mkdir -p content data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content data/history.json site
          if ! git diff --cached --quiet; then
            git commit -m 'Publish generated news [skip ci]'
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
